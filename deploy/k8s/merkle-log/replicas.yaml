# The 3 log replicas: append-only log + Merkle tree, one persistent volume each.
#
# Why a StatefulSet and not a Deployment:
#   - stable identity: log-replica-0/1/2 keep their name (and DNS name) across restarts,
#     so peers and clients can address "replica 2" even after it was rescheduled;
#   - stable storage: each replica gets its own PersistentVolumeClaim (data-log-replica-N)
#     that follows it, so a crashed replica restarts with its log and resumes from its root.
#
# Contract expected from the replica image (see deploy/k8s/README.md):
#   HTTP on port 7000, GET /health (process alive), data under $DATA_DIR,
#   identity in $REPLICA_ID, peers in $LOG_REPLICAS (comma-separated, includes itself).
---
apiVersion: v1
kind: Service
metadata:
  name: log-replica
spec:
  # Headless: one DNS record per pod (log-replica-N.log-replica), no load balancing.
  clusterIP: None
  # Peers must resolve each other even when not Ready (e.g. during startup or a partition).
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: log-replica
  ports:
    - name: http
      port: 7000
---
# Convenience entry point: any Ready replica. Clients that must survive partitions should
# not rely on it alone; they iterate over $LOG_REPLICAS until one answers.
apiVersion: v1
kind: Service
metadata:
  name: log
spec:
  selector:
    app.kubernetes.io/name: log-replica
  ports:
    - name: http
      port: 7000
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: log-replica
spec:
  serviceName: log-replica
  replicas: 3
  # Start all replicas at once: they do not depend on each other to boot.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: log-replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-replica
        app.kubernetes.io/component: replica
    spec:
      # Put each replica on a different node when possible, so that losing one node only
      # loses one replica. "Preferred" so it still schedules on a 1-node cluster.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: log-replica
      # Give the replica time to flush its log and tree on a graceful stop.
      terminationGracePeriodSeconds: 20
      containers:
        - name: replica
          image: merkle-log-replica
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7000
          envFrom:
            - configMapRef:
                name: merkle-config
          env:
            - name: REPLICA_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: DATA_DIR
              value: /data
          # Liveness only checks that the process answers. It must NOT depend on the peers:
          # a replica cut off by a partition is healthy and must keep accepting writes.
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# With 3 replicas, keep at least 2 during voluntary disruptions (node drain, upgrade), so
# the log stays replicated. Involuntary failures (crash, partition) are what the
# experiments test, and a PDB does not prevent those.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-replica
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: log-replica
