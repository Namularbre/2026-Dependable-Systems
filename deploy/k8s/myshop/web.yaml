# Three stateless replicas of the web app behind one service (replaces web1-3 + nginx).
# The service load-balances across ready pods; no sticky sessions are needed because
# auth cookies and antiforgery tokens use data-protection keys shared through the database.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      # Spread the replicas over nodes when the cluster has several, so one node failure
      # does not take the whole shop down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
      initContainers:
        # Same as "depends_on: migrator: service_completed_successfully" in compose:
        # wait until the migrator has seeded the catalog (its last step).
        - name: wait-for-migrations
          image: citusdata/citus:13.0
          env:
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: myshop-credentials, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: myshop-credentials, key: POSTGRES_PASSWORD } }
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: myshop-credentials, key: POSTGRES_DB } }
          command:
            - sh
            - -c
            - |
              until [ "$(psql -h citus-coordinator -tAc 'SELECT count(*) > 0 FROM "Items"' 2>/dev/null)" = "t" ]; do
                echo "waiting for the migrator to finish"
                sleep 3
              done
      containers:
        - name: web
          image: myshop-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # The pod name (web-<hash>-<id>) shows in logs, the footer and X-Served-By.
            - name: INSTANCE_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: Database__MigrateOnStartup
              value: "false"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: myshop-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: myshop-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: myshop-credentials, key: POSTGRES_DB } }
            - name: ConnectionStrings__Shop
              value: Host=citus-coordinator;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)
            # Where to ship logs once the app has a Merkle log sink (not read by the app yet).
            # Same list as merkle-config in deploy/k8s/merkle-log/config.yaml.
            - name: MerkleLog__Replicas
              value: "http://log-replica-0.log-replica.merkle-log.svc.cluster.local:7000,http://log-replica-1.log-replica.merkle-log.svc.cluster.local:7000,http://log-replica-2.log-replica.merkle-log.svc.cluster.local:7000"
          # /health also checks the database: a replica that cannot reach it leaves the service.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 2
          # Liveness only checks the process, so a database outage does not restart every replica.
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Keep at least 2 replicas up during voluntary disruptions (node drain, cluster upgrade).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
