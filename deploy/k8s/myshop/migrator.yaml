# One-shot job: applies the EF migrations (incl. Citus distribution), creates the shared
# data-protection key and seeds the admin + demo items. Same role as the compose "migrator".
# The seeding is idempotent, so the job can be deleted and re-applied safely.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrator
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrator
    spec:
      restartPolicy: OnFailure
      initContainers:
        # The coordinator service only routes to a ready pod, i.e. once its init script
        # has registered both workers.
        - name: wait-for-coordinator
          image: citusdata/citus:13.0
          command: ["sh", "-c", "until pg_isready -h citus-coordinator -p 5432; do echo waiting for citus-coordinator; sleep 2; done"]
      containers:
        - name: migrator
          image: myshop-web
          imagePullPolicy: IfNotPresent
          env:
            - name: INSTANCE_NAME
              value: migrator
            - name: Database__MigrateAndExit
              value: "true"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: myshop-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: myshop-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: myshop-credentials, key: POSTGRES_DB } }
            - name: ConnectionStrings__Shop
              value: Host=citus-coordinator;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)
            - name: Seed__AdminEmail
              valueFrom: { secretKeyRef: { name: myshop-credentials, key: ADMIN_EMAIL } }
            - name: Seed__AdminPassword
              valueFrom: { secretKeyRef: { name: myshop-credentials, key: ADMIN_PASSWORD } }
