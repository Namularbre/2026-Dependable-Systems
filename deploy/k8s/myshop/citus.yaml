# Sharded database: 1 coordinator + 2 workers, each with its own persistent volume.
#
# Workers are one StatefulSet behind a headless service, so each pod has a stable DNS name
# (citus-worker-0.citus-worker, citus-worker-1.citus-worker) that survives restarts. Citus
# stores the workers by name in pg_dist_node, so stable names are what make a restart safe.
---
apiVersion: v1
kind: Service
metadata:
  name: citus-worker
spec:
  clusterIP: None
  # Resolve worker names before they are ready: the coordinator's init script waits on them.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: citus-worker
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: citus-worker
spec:
  serviceName: citus-worker
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: citus-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: citus-worker
    spec:
      containers:
        - name: postgres
          image: citusdata/citus:13.0
          envFrom:
            - secretRef:
                name: myshop-credentials
          env:
            # Nodes authenticate to each other inside the cluster network (same as compose).
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            # A subdirectory, because some volume types put a lost+found folder at the mount root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            # TCP check: only true once init scripts are done and the real server is listening.
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: citus-coordinator
spec:
  selector:
    app.kubernetes.io/name: citus-coordinator
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: citus-coordinator-init
data:
  # Same logic as deploy/citus/init-coordinator.sh (kustomize cannot read files outside deploy/k8s).
  # Runs once, when the coordinator's data directory is first initialised.
  010-add-workers.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    for worker in ${CITUS_WORKERS}; do
      until pg_isready -h "$worker" -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /dev/null 2>&1; do
        echo "waiting for citus worker $worker..."
        sleep 1
      done
    done

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-SQL
      SELECT citus_set_coordinator_host('${CITUS_COORDINATOR_HOST}', 5432);
    SQL

    for worker in ${CITUS_WORKERS}; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
        -c "SELECT citus_add_node('$worker', 5432);"
    done

    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -c "SELECT nodename, nodeport, shouldhaveshards FROM pg_dist_node;"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: citus-coordinator
spec:
  serviceName: citus-coordinator
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: citus-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: citus-coordinator
    spec:
      containers:
        - name: postgres
          image: citusdata/citus:13.0
          envFrom:
            - secretRef:
                name: myshop-credentials
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: CITUS_COORDINATOR_HOST
              value: citus-coordinator
            - name: CITUS_WORKERS
              value: citus-worker-0.citus-worker citus-worker-1.citus-worker
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            # Generous: on first start the init script waits for both workers.
            initialDelaySeconds: 120
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/010-add-workers.sh
              subPath: 010-add-workers.sh
      volumes:
        - name: init
          configMap:
            name: citus-coordinator-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
